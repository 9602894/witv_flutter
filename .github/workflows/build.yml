name: Build Android APK and Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Create .netrc for git authentication
        run: |
          echo "machine github.com login x-access-token password ${{ secrets.GITHUB_TOKEN }}" > ~/.netrc

      - name: Clean pub cache
        run: flutter pub cache repair

      - name: Install dependencies
        run: flutter pub get

      - name: Clean build
        run: flutter clean

      - name: Generate app icons
        run: flutter pub run flutter_launcher_icons:main

      - name: Build Android APK (release)
        run: flutter build apk --release

      - name: Set artifact name with time and commit
        id: set_name
        run: |
          TZ='Asia/Shanghai' date +%Y%m%d%H%M > datetime.txt
          DATETIME=$(cat datetime.txt)
          COMMIT_SHORT=$(echo ${{ github.sha }} | cut -c1-7)
          ARTIFACT_NAME="witv-android-apk-${DATETIME}-${COMMIT_SHORT}"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV
          echo "APK_PATH=build/app/outputs/flutter-apk/app-release.apk" >> $GITHUB_ENV

      - name: Upload Android APK (as artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.APK_PATH }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Release"
          body: "Automated APK build from commit ${{ github.sha }}"
          files: |
            ${{ env.APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
