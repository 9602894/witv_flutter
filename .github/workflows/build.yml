name: Build Witv Flutter

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure Windows project exists
        run: flutter create --platforms=windows .

      - name: Build Windows release
        run: flutter build windows --release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: witv-windows-x64
          path: build/windows/x64/runner/Release/

  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure Android project exists
        run: flutter create --platforms=android .

      # 下载 libmpv.so 并放入 jniLibs
      - name: Download libmpv.so
        run: |
          # 创建 jniLibs 目录
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          
          # 下载 arm64-v8a 版本
          curl -L -o android/app/src/main/jniLibs/arm64-v8a/libmpv.so \
            https://github.com/media-kit/libmpv-android-video-build/releases/download/v1.0.1/arm64-v8a/libmpv.so
          
          # 下载 armeabi-v7a 版本
          curl -L -o android/app/src/main/jniLibs/armeabi-v7a/libmpv.so \
            https://github.com/media-kit/libmpv-android-video-build/releases/download/v1.0.1/armeabi-v7a/libmpv.so
          
          # 可选：也下载 x86_64 用于模拟器
          mkdir -p android/app/src/main/jniLibs/x86_64
          curl -L -o android/app/src/main/jniLibs/x86_64/libmpv.so \
            https://github.com/media-kit/libmpv-android-video-build/releases/download/v1.0.1/x86_64/libmpv.so
          
          echo "✅ libmpv.so 下载完成"

      - name: Remove problematic plugins
        run: rm -rf $HOME/.pub-cache/hosted/pub.dev/screen_brightness_android-*

      - name: Build Android APK (release)
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: witv-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  release:
    name: Create Release and Upload Assets
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: witv-windows-x64
          path: ./windows-build

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: witv-android-apk
          path: ./android-build

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./windows-build/*.exe
            ./windows-build/*.dll
            ./windows-build/data/
            ./android-build/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
