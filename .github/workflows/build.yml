name: Build Witv Flutter

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest  # Windows 构建必须用 Windows runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'  # 可指定版本，或使用 'stable'
          channel: 'stable'

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: witv-windows-x64
          path: build/windows/x64/runner/Release/

  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest  # Android 可在 Ubuntu 上构建，更快
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK (release)
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: witv-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # 可选：自动发布到 Releases
  release:
    name: Create Release and Upload Assets
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')  # 仅当推送 tag 时触发
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: witv-windows-x64
          path: ./windows-build

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: witv-android-apk
          path: ./android-build

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./windows-build/*.exe
            ./windows-build/*.dll
            ./windows-build/data/
            ./android-build/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
