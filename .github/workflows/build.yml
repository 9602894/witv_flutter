name: Build Witv Flutter

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ---------- Windows 构建 ----------
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure Windows project exists
        run: flutter create --platforms=windows .

      - name: Build Windows release
        run: flutter build windows --release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: witv-windows-x64
          path: build/windows/x64/runner/Release/

  # ---------- Android 构建 ----------
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure Android project exists
        run: flutter create --platforms=android .

      # 🔧 修补 screen_brightness_android 插件的 Kotlin DSL 编译错误
      - name: Patch screen_brightness_android build.gradle.kts
        run: |
          # 定位插件文件
          PLUGIN_FILE=$(find $HOME/.pub-cache/hosted/pub.dev/ -name "build.gradle.kts" -path "*/screen_brightness_android*/android/*" | head -n 1)
          if [ -n "$PLUGIN_FILE" ]; then
            echo "正在修补文件: $PLUGIN_FILE"
            # 修复 jvmTarget 赋值错误
            sed -i 's/jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8/jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8)/' "$PLUGIN_FILE"
            # 修复 compilerOptions 块语法错误
            sed -i 's/compilerOptions {/kotlinOptions {/g' "$PLUGIN_FILE"
            echo "✅ 修补完成"
          else
            echo "⚠️ 未找到 screen_brightness_android 插件文件，跳过修补"
          fi

      - name: Build Android APK (release)
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: witv-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # ---------- 发布 Release（可选） ----------
  release:
    name: Create Release and Upload Assets
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    # 仅当推送 tag（如 v1.0.0）时触发
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: witv-windows-x64
          path: ./windows-build

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: witv-android-apk
          path: ./android-build

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./windows-build/*.exe
            ./windows-build/*.dll
            ./windows-build/data/
            ./android-build/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
