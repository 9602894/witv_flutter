name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Clean pub cache
        run: flutter pub cache repair

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure Android project exists
        run: flutter create --platforms=android .

      - name: Build Android APK (release)
        run: flutter build apk --release

      - name: Set artifact name with time and commit
        id: set_name
        run: |
          # 获取北京时间 (UTC+8)
          TZ='Asia/Shanghai' date +%Y%m%d%H%M > datetime.txt
          DATETIME=$(cat datetime.txt)
          COMMIT_SHORT=$(echo ${{ github.sha }} | cut -c1-7)
          ARTIFACT_NAME="witv-android-apk-${DATETIME}-${COMMIT_SHORT}"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build/app/outputs/flutter-apk/app-release.apk
