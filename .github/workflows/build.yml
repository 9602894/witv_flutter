name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Clean pub cache
        run: flutter pub cache repair

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure Android project exists
        run: flutter create --platforms=android .

      - name: Download and extract libmpv.so
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p android/app/src/main/jniLibs/x86
          mkdir -p android/app/src/main/jniLibs/x86_64
          sudo apt-get install -y unzip
          # 正确下载链接（不带 ?raw=true）
          wget -O video-arm64-v8a.jar https://github.com/media-kit/android-dependencies/releases/download/v0.0.3/video-arm64-v8a.jar
          wget -O video-armeabi-v7a.jar https://github.com/media-kit/android-dependencies/releases/download/v0.0.3/video-armeabi-v7a.jar
          wget -O video-x86.jar https://github.com/media-kit/android-dependencies/releases/download/v0.0.3/video-x86.jar
          wget -O video-x86_64.jar https://github.com/media-kit/android-dependencies/releases/download/v0.0.3/video-x86_64.jar
          unzip -j video-arm64-v8a.jar -d android/app/src/main/jniLibs/arm64-v8a/
          unzip -j video-armeabi-v7a.jar -d android/app/src/main/jniLibs/armeabi-v7a/
          unzip -j video-x86.jar -d android/app/src/main/jniLibs/x86/
          unzip -j video-x86_64.jar -d android/app/src/main/jniLibs/x86_64/
          ls -la android/app/src/main/jniLibs/arm64-v8a/

      - name: Build Android APK (release)
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: witv-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
