name: Build Witv Flutter

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure Windows project exists
        run: flutter create --platforms=windows .

      - name: Build Windows release
        run: flutter build windows --release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: witv-windows-x64
          path: build/windows/x64/runner/Release/

  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure Android project exists
        run: flutter create --platforms=android .

      # 🔧 精确修补 screen_brightness_android 插件
      - name: Patch screen_brightness_android
        run: |
          # 定位主插件的 android/build.gradle.kts（排除 example、test、sample 等）
          PLUGIN_FILE=$(find $HOME/.pub-cache/hosted/pub.dev/ -path "*/screen_brightness_android*/android/build.gradle.kts" ! -path "*/example/*" ! -path "*/test/*" ! -path "*/sample/*" | head -n 1)
          if [ -z "$PLUGIN_FILE" ]; then
            echo "❌ 未找到主构建文件"
            exit 1
          fi
          echo "📄 找到文件: $PLUGIN_FILE"
          
          # 修复 jvmTarget 赋值错误
          sed -i 's/jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8/jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8)/' "$PLUGIN_FILE"
          
          # 如果存在 compilerOptions 块（第74行），将其删除或替换为 kotlinOptions
          # 这里我们直接删除整个 compilerOptions { ... } 块（包括大括号内容）
          perl -0777 -i -pe 's/\s*compilerOptions\s*\{[^}]*\}//g' "$PLUGIN_FILE"
          
          # 验证修复
          if grep -q "jvmTarget = " "$PLUGIN_FILE"; then
            echo "❌ jvmTarget 修复失败"
            exit 1
          fi
          if grep -q "compilerOptions" "$PLUGIN_FILE"; then
            echo "❌ compilerOptions 未删除"
            exit 1
          fi
          echo "✅ 修补完成"

      - name: Build Android APK (release)
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: witv-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  release:
    name: Create Release and Upload Assets
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: witv-windows-x64
          path: ./windows-build

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: witv-android-apk
          path: ./android-build

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./windows-build/*.exe
            ./windows-build/*.dll
            ./windows-build/data/
            ./android-build/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
