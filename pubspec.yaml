dependencies:
  flutter:
    sdk: flutter

  # 移除 video_player，改用 media_kit
  media_kit: ^1.2.6
  media_kit_video: ^1.2.4
  media_kit_native_event_loop: ^1.0.8  # Android/iOS 必需

  # 其他依赖不变...
  dio: ^5.4.0
  xml: ^6.5.0
  json_annotation: ^4.8.1
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  path_provider: ^2.1.2
  flutter_svg: ^2.0.9
  crypto: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/configuration.json
    - assets/epg_data.json

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "ico/ic_launcher.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "ico/ic_launcher.png"
