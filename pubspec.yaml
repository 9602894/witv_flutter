name: witv_flutter
description: 跨平台直播播放器（类酷9）
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 播放器核心
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4   # 降级以兼容 Flutter 3.22
  media_kit_native_event_loop: ^1.0.8

  dio: ^5.4.0
  xml: ^6.5.0
  json_annotation: ^4.8.1
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  path_provider: ^2.1.2
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/configuration.json
    - assets/epg_data.json

dependency_overrides:
  media_kit_video: 1.2.4   # 强制锁定
